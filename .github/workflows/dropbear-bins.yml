name: Build dropbear static binaries

# Builds static dropbearmulti for all Spud-supported architectures using
# zig cc as the cross-compiler (no external toolchain downloads needed).
# Publishes binaries as a GitHub release tagged "dropbear-bins".

on:
  workflow_dispatch:

  # Every Monday at 03:00 UTC — picks up new dropbear releases
  schedule:
    - cron: '0 3 * * 1'

  # On push: only build if the release doesn't exist yet OR workflow changed
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/dropbear-bins.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.chk.outputs.should_build }}
    steps:
      - name: Check if dropbear-bins release already exists
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view dropbear-bins --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists — skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release missing — will build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Install Zig
        run: |
          ZIG_VER="0.13.0"
          wget -q --tries=3 \
            "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" \
            -O zig.tar.xz
          tar -xJf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-${ZIG_VER}" >> "$GITHUB_PATH"
          zig version

      - name: Download dropbear source
        run: |
          DROPBEAR_VER="2024.86"
          wget -q --tries=3 \
            "https://matt.ucc.asn.au/dropbear/releases/dropbear-${DROPBEAR_VER}.tar.bz2"
          tar -xjf "dropbear-${DROPBEAR_VER}.tar.bz2"
          echo "DROPBEAR_SRC=$PWD/dropbear-${DROPBEAR_VER}" >> "$GITHUB_ENV"

      - name: Build for all targets
        run: |
          # FORMAT: "zig_target:extra_cflags:output_arch_name"
          TARGETS=(
            "x86_64-linux-musl::x86_64"
            "aarch64-linux-musl::aarch64"
            "arm-linux-musleabihf:-mcpu=cortex_a7:armv7"
            "arm-linux-musleabihf:-mcpu=arm1176jzf_s:armv6"
            "mipsel-linux-musl::mipsel"
            "mips-linux-musl::mips"
            "x86-linux-musl::i686"
            "riscv64-linux-musl::riscv64"
          )

          for entry in "${TARGETS[@]}"; do
            IFS=: read -r ZIG_TARGET EXTRA_CFLAGS ARCH <<< "$entry"
            echo ""
            echo "══════════════════════════════════════════"
            echo "  Building dropbearmulti-${ARCH} (${ZIG_TARGET})"
            echo "══════════════════════════════════════════"

            # Fresh copy of source for each arch
            BUILD_DIR="build-${ARCH}"
            cp -r "$DROPBEAR_SRC" "$BUILD_DIR"
            pushd "$BUILD_DIR"

            ./configure \
              --host="$ZIG_TARGET" \
              CC="zig cc -target ${ZIG_TARGET} ${EXTRA_CFLAGS}" \
              AR="zig ar" \
              RANLIB="zig ranlib" \
              CFLAGS="-Os" \
              LDFLAGS="-static" \
              --disable-zlib \
              --disable-shadow \
              --disable-lastlog \
              --disable-utmp \
              --disable-utmpx \
              --disable-wtmp \
              --disable-wtmpx \
              --disable-pututxline \
              --disable-loginfunc \
              --disable-pam

            make PROGRAMS="dropbearmulti" STATIC=1 -j"$(nproc)"

            # Verify it's actually static
            file dropbearmulti
            cp dropbearmulti "../dropbearmulti-${ARCH}"
            popd
            rm -rf "$BUILD_DIR"
          done

          echo ""
          echo "All binaries:"
          ls -lh dropbearmulti-*

      - name: Upload all binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbearmulti-all
          path: dropbearmulti-*

  release:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: dropbearmulti-all

      - name: List binaries
        run: ls -lh dropbearmulti-*

      - name: "Publish as GitHub release (tag: dropbear-bins)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dropbear-bins
          name: "Dropbear static musl binaries"
          body: |
            Pre-built static dropbearmulti binaries used by Spud's setup.sh.
            Built from dropbear 2024.86 with zig cc cross-compilation.
            Regenerate by re-running the "Build dropbear static binaries" workflow.
          files: dropbearmulti-*
          make_latest: "false"
